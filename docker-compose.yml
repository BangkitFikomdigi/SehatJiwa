services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sehatjiwa
      POSTGRES_PASSWORD: sehatjiwa
      POSTGRES_DB: sehatjiwa
    ports:
      - "5432:5432"
    volumes:
      - sehatjiwa_pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "password_encryption=md5", "-c", "listen_addresses=*", "-c", "max_connections=100"]	